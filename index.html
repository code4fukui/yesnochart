<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:">
<title>yesnochart</title>
</head><body>
<h1 id=h1title>yesnochart</h1>
<div class=box id=box>
  <div class=q id=divq></div>
</div>

<div class=qr>
<script type="module" src="https://code4fukui.github.io/qr-code/qr-code.js"></script><qr-code></qr-code>
</div>

<footer>
<a href=https://github.com/code4fukui/yesnochart/>src on GitHub</a><br>
</footer>

<script type="module">
import { CSV } from "https://js.sabae.cc/CSV.js";

const fn = location.hash.substring(1) || "data/sample.csv";
const data = await CSV.fetchJSON(fn);

const nans = Object.keys(data[0]).filter(i => i.startsWith("answer")).length / 2;
console.log(nans);
const divans = [];
for (let i = 0; i < nans; i++) {
  const div = document.createElement("div");
  div.className = "a";
  box.appendChild(div);
  divans.push(div);
}

const show = (id) => {
  const item = data.find(i => i.id == id);
  if (!item) {
    location.href = id;
    return;
  }
  divq.textContent = item.question;
  for (let i = 0; i < nans; i++) {
    const diva = divans[i];
    const slabel = `answer${i + 1}_label`;
    const sid = `answer${i + 1}_id`;
    diva.style.display = item[slabel] ? "block" : "none";
    diva.textContent = item[slabel];
    diva.onclick = () => show(item[sid]);
  }
};
show(1);

h1title.onclick = () => show(1);
</script>

<style>
body {
  font-family: sans-serif;
}
h1 {
  text-align: center;
  font-size: 100%;
  margin: .5em;
}
.box {
  background-color: #f8f8f8;
  padding: 1em;
}
.q, .a {
  word-wrap: break-word;
}
.q {
  font-size: 200%;
  margin: .5em;
}
.a {
  font-size: 150%;
  margin: .5em;
  padding: .5em;
  border: 2px solid black;
}
@media (hover: hover) {
  .a:hover {
    background-color: #faaaaa;
  }
}
a {
  color: gray;
}
footer {
  margin: 1em;
  text-align: center;
}
.qr {
  text-align: center;
}
</style>

</body></html>
